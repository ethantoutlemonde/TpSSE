<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Suivi de commande</title>
</head>
<body>
  <h1 id="title">Suivi de commande</h1>
  <p>Statut : <strong id="status">...</strong></p>
  <p id="info"></p>

  <script>
    const labels = {
      preparing: "En preparation",
      shipped: "Expediee",
      delivered: "Livree",
      cancelled: "Annulee",
    };

    const id = new URLSearchParams(location.search).get("id");
    const statusEl = document.getElementById("status");

    function isFinished(order) {
      return order.status === "delivered" || order.status === "cancelled";
    }

    function showOrder(order) {
      document.getElementById("title").textContent = "Commande #" + order.id;
      document.getElementById("info").textContent = "Produit " + order.productId + ", quantite " + order.quantity;
      statusEl.textContent = labels[order.status];
    }

    fetch("/orders/" + id).then((res) => {
      if (!res.ok) {
        statusEl.textContent = "Commande introuvable";
        return;
      }
      res.json().then((order) => {
        showOrder(order);
        if (isFinished(order)) return;

        const source = new EventSource("/orders/" + id + "/events");
        function update(e) {
          const order = JSON.parse(e.data);
          showOrder(order);
          if (isFinished(order)) source.close();
        }
        source.addEventListener("order-status", update);
        source.addEventListener("order-cancelled", update);
      });
    });
  </script>
</body>
</html>
